name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ride-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ride-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build ride-core (server depends on it)
        run: npm install --no-audit --no-fund && npm run build
        working-directory: packages/ride-core
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm test
